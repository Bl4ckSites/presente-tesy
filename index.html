<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- METADADOS SEGUROS (Obrigatório para o Robô do Meta Ads, mas invisível ao usuário) -->
    <title>Surpresa Exclusiva | Clube VIP</title>
    <meta name="description" content="Descubra conteúdos exclusivos e bastidores. Toque para revelar sua surpresa personalizada.">
    <meta property="og:title" content="Surpresa Exclusiva | Clube VIP">
    <meta property="og:description" content="Acesse nossa área de membros e confira os bastidores.">
    <meta property="og:image" content="https://fadinha.xyz/assets/og-image-safe.jpg"> <!-- Coloque uma imagem segura aqui -->
    <meta property="og:type" content="website">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="style.css">
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad" defer></script>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="blur-orb orb-1"></div>
    <div class="blur-orb orb-2"></div>
    <div class="blur-orb orb-3"></div>
    
    <canvas id="particlesCanvas"></canvas>

    <div class="container">
        <div class="gift-wrapper" id="giftBox" tabindex="0" role="button" aria-label="Abrir presente">
            <div class="gift-glow"></div>
            <div class="gift-lid">
                <div class="lid-top"><div class="lid-shine"></div></div>
                <div class="lid-front"></div>
            </div>
            <div class="gift-base">
                <div class="base-front"><div class="base-inner"></div></div>
                <div class="gift-ribbon-vertical"><div class="ribbon-shine"></div></div>
                <div class="gift-ribbon-horizontal"><div class="ribbon-shine"></div></div>
                <div class="gift-bow">
                    <div class="bow-loop bow-left"></div>
                    <div class="bow-loop bow-right"></div>
                    <div class="bow-center"></div>
                </div>
            </div>
            <div class="open-flash" id="openFlash"></div>
        </div>
        <p class="touch-text">Toque na caixa para abrir</p each>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader-ring"></div>
        <p>Preparando sua surpresa...</p>
    </div>

    <div id="sparkleContainer"></div>
    <div class="confetti-container" id="confettiContainer"></div>

    <script src="script.js"></script>
</body>
</html>
